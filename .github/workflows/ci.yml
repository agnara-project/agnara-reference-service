name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Python 3.14 Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Verify exact versions
        run: |
          python -c "import agnara; assert agnara.__version__ == '0.1.0a3', f'Wrong agnara: {agnara.__version__}'"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run test suite
        run: |
          pytest -v

      - name: Run interactive CLI application
        run: |
          python app.py
